<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--navy:#1f3864;--blue:#2e5496;--accent:#c0392b;--ink:#222;--muted:#777;--line:#e3e8f0;--bg:#f6f8fb}
*{box-sizing:border-box}body{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;color:var(--ink);margin:0;background:var(--bg);line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 80px}
header.head{border-bottom:4px solid var(--navy);padding-bottom:18px;margin-bottom:8px}
h1{font-size:26px;color:var(--navy);margin:0 0 6px}.sub{color:var(--muted);font-size:13px}
h2{font-size:20px;color:#fff;background:var(--navy);padding:10px 16px;border-radius:6px;margin:46px 0 16px}
h3{font-size:15px;color:var(--blue);border-left:4px solid var(--blue);padding-left:10px;margin:28px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:24px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kpi .v{font-size:23px;font-weight:700;color:var(--navy)}.kpi .l{font-size:12px;color:var(--muted);margin-top:4px}.kpi .s{font-size:11px;color:#999;margin-top:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.chart-box{position:relative;height:300px}.chart-box.tall{height:340px}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:right}th{background:var(--navy);color:#fff;text-align:center;position:sticky;top:0}
td:first-child,th:first-child{text-align:center}tbody tr:nth-child(even){background:#f4f7fb}tfoot td{background:var(--blue);color:#fff;font-weight:700}
.scroll{max-height:430px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.note{font-size:12.5px;color:#555;background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:14px 18px;margin:16px 0}.note b{color:var(--accent)}
.insight{background:#fdf3f2;border:1px solid #f0c9c4;border-left:4px solid var(--accent);border-radius:8px;padding:14px 18px;margin:16px 0;font-size:13.5px}.insight b{color:var(--accent)}
.bad{color:#c0392b;font-weight:700}.warn{color:#e08a1e;font-weight:700}.good{color:#2e7d32;font-weight:700}
.lead{color:#444;font-size:14px}footer{margin-top:50px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
.fyrow{margin:18px 0 6px}.fyhead{font-size:14px;font-weight:700;color:#fff;background:var(--blue);display:inline-block;padding:6px 14px;border-radius:8px 8px 0 0}.fyrow.cur .fyhead{background:var(--accent)}.fyhead span{font-weight:400;font-size:11px;opacity:.9}
.pill{display:inline-block;background:#eef2f8;color:var(--blue);border-radius:20px;padding:2px 10px;font-size:11px;margin-right:6px}
</style></head>
